name: Deploy

# Triggered by build.yml finishing successfully on main (not by push directly — this makes
# sure a deploy never fires against images that failed to build/push), plus a manual button
# for redeploying the current `latest` tag without a new commit (e.g. after fixing something
# on the VM itself).
#
# Deploys only this repo's own services (`migrate`, `backend`) — never touches `postgres` or
# `frontend`, which are provisioned/deployed independently (frontend has its own deploy.yml
# in the frontend-gerance repo; postgres is a one-time manual `up` on the VM, see the
# one-time-setup note in DOCKERIZATION_TODO.md / the chat that built this pipeline).
#
# Assumes docker-compose.image.yml + a real .env already exist on the VM at
# /opt/gerance-platform — this workflow does not create or scp them. They live at the repo root
# (gerance-platform/), a location neither this repo nor frontend-gerance's checkout
# contains, so there's nothing here to keep in sync automatically; update them on the VM by
# hand if they ever change.

on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runs ON the VM, through a self-hosted runner registered with the `secops-vm` label,
    # so nothing has to reach the VM from the internet (a VirtualBox VM behind NAT can't be
    # SSHed into from GitHub's cloud). build.yml still runs on GitHub-hosted runners.
    runs-on: [self-hosted, secops-vm]

    steps:
      - name: Deploy migrate + backend
        working-directory: /opt/gerance-platform
        run: |
          set -e
          # Only needed while the GHCR packages are private. The login is dropped again at
          # the end of the job so the VM (and any OVA exported from it) keeps no token.
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

          # BACKEND_TAG, not a shared TAG: `docker compose up` reconciles the whole dependency
          # graph, so a shared tag made one repo's deploy try to pull the other repo's image
          # at the wrong sha (real failed deploy, 2026-08-22). Each pipeline moves only its
          # own tag; see docker-compose.image.yml.
          export BACKEND_TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          docker compose -f docker-compose.image.yml pull migrate backend
          docker compose -f docker-compose.image.yml up -d migrate backend

      - name: Forget the registry login
        if: always()
        run: docker logout ghcr.io
